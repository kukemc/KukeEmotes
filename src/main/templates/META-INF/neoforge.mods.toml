modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Client-only: the mod never touches the dedicated server. Sync (when available) rides KukeUI's
# plugin-message channel and is talked to by the KukeCore Paper plugin, not by a server-side mod.
#
# No mixins: the render takeover rides NeoForge's cancellable RenderPlayerEvent.Pre, so this mod
# patches nothing and cannot collide with KukeUI's player-render mixins.

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
